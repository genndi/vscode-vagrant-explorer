<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Ícone da extensão: três VMs ligadas a duas redes; a do meio está nas duas (roteia). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2b4d"/>
      <stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
    <linearGradient id="vm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fc"/>
      <stop offset="1" stop-color="#d5ddea"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- redes -->
  <line x1="34" y1="160" x2="222" y2="160" stroke="#3fb950" stroke-width="12" stroke-linecap="round"/>
  <line x1="34" y1="206" x2="222" y2="206" stroke="#a371f7" stroke-width="12" stroke-linecap="round"/>

  <!-- descidas: o contorno escuro "corta" a rede cruzada -->
  <g stroke-linecap="round">
    <line x1="56" y1="96" x2="56" y2="160" stroke="#3fb950" stroke-width="8"/>
    <line x1="118" y1="96" x2="118" y2="160" stroke="#3fb950" stroke-width="8"/>
    <line x1="138" y1="96" x2="138" y2="150" stroke="#131b30" stroke-width="18"/>
    <line x1="138" y1="96" x2="138" y2="206" stroke="#a371f7" stroke-width="8"/>
    <line x1="200" y1="96" x2="200" y2="150" stroke="#131b30" stroke-width="18"/>
    <line x1="200" y1="96" x2="200" y2="206" stroke="#a371f7" stroke-width="8"/>
  </g>
  <g stroke="#111a2e" stroke-width="5">
    <circle cx="56" cy="160" r="11" fill="#3fb950"/>
    <circle cx="118" cy="160" r="11" fill="#3fb950"/>
    <circle cx="138" cy="206" r="11" fill="#a371f7"/>
    <circle cx="200" cy="206" r="11" fill="#a371f7"/>
  </g>

  <!-- VMs -->
  <g>
    <rect x="26" y="44" width="60" height="54" rx="11" fill="url(#vm)"/>
    <rect x="98" y="44" width="60" height="54" rx="11" fill="url(#vm)"/>
    <rect x="170" y="44" width="60" height="54" rx="11" fill="url(#vm)"/>
  </g>
  <g fill="#9aa7bd">
    <rect x="36" y="56" width="30" height="7" rx="3.5"/>
    <rect x="108" y="56" width="30" height="7" rx="3.5"/>
    <rect x="180" y="56" width="30" height="7" rx="3.5"/>
    <rect x="36" y="69" width="20" height="6" rx="3"/>
    <rect x="108" y="69" width="20" height="6" rx="3"/>
    <rect x="180" y="69" width="20" height="6" rx="3"/>
  </g>
  <g fill="#2ea043">
    <circle cx="74" cy="84" r="5"/>
    <circle cx="146" cy="84" r="5"/>
    <circle cx="218" cy="84" r="5"/>
  </g>
</svg>
