name: Release

# Ao publicar uma release (ex.: gh release create v0.6.1), testa, gera o .vsix,
# anexa à própria release e publica no Visual Studio Marketplace.
#
# A publicação usa Trusted Publishing (OIDC): não há token guardado no
# repositório. A política fica no Marketplace (publisher genndi → Trusted
# Publishing) e aponta para genndi/vscode-vagrant-explorer e este arquivo,
# release.yml. Renomear o repositório ou o arquivo exige atualizar a política.
# Releases marcadas como pré-release não são publicadas.
on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write # token OIDC trocado pela credencial do Marketplace

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Confere se a tag bate com a versão do package.json
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::A tag $tag não bate com a versão do package.json ($version)."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npx -y @vscode/vsce@3 package
      - name: Anexa o .vsix à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" *.vsix --clobber
      - name: Publica no Visual Studio Marketplace
        if: ${{ !github.event.release.prerelease }}
        run: npx -y @vscode/vsce@latest publish --oidc --packagePath *.vsix
